<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1220" role="img"><title>thread82 搬运 A[3,18] 到 SMEM 元素202的地址分解</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="29" fill="#172554">A[3,18]：谁搬它，与放到哪里，是两个问题</text><text x="30" y="78" font-size="17" fill="#172554">以下假设 A 的 SMEM 数组起点为 1024-byte 对齐。所有元素索引均相对各自数组起点。</text><rect x="385" y="105" width="430" height="75" rx="8" fill="#fef3c7" stroke="#94a3b8"/><text x="405" y="135" font-size="20" fill="#172554">逻辑身份：A[3,18]，本示例数值 4</text><text x="405" y="164" font-size="17" fill="#172554">m=3，k=18；无论存到哪里都不改变</text><path d="M435,182 L270,232" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tip)"/><path d="M765,182 L930,232" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tip)"/><rect x="30" y="240" width="535" height="120" rx="8" fill="#ede9fe" stroke="#94a3b8"/><text x="48" y="272" font-size="20" fill="#172554">问题 1：哪个线程搬？——输入 copy 映射</text><text x="48" y="308" font-size="19" fill="#172554">t = 64×(m mod 2) + k = 64×1 + 18 = 82</text><text x="48" y="340" font-size="17" fill="#172554">thread82 = warp2 / lane18；不代入物理列号。</text><rect x="600" y="240" width="570" height="120" rx="8" fill="#ccfbf1" stroke="#94a3b8"/><text x="618" y="272" font-size="20" fill="#172554">问题 2：放到哪里？——目标 swizzle 布局</text><text x="618" y="308" font-size="18" fill="#172554">q=18/8=2，u=18%8=2；p=q XOR 3=1</text><text x="618" y="340" font-size="17" fill="#172554">每个 sector 是 16 bytes，容纳 8 个 FP16。</text><text x="30" y="405" font-size="20" fill="#172554">第 3 行：行首元素偏移 3×64=192，行首字节偏移 384。</text><text x="30" y="444" font-size="17" fill="#172554">GMEM 地址顺序</text><text x="30" y="477" font-size="15" fill="#172554">行主序：槽位 = q</text><rect x="220" y="460" width="108" height="93" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="228" y="486" font-size="18" fill="#172554">槽位 0</text><text x="228" y="514" font-size="15" fill="#172554">k 0–7</text><text x="228" y="540" font-size="12" fill="#172554">元素 192–199</text><rect x="336" y="460" width="108" height="93" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="344" y="486" font-size="18" fill="#172554">槽位 1</text><text x="344" y="514" font-size="15" fill="#172554">k 8–15</text><text x="344" y="540" font-size="12" fill="#172554">元素 200–207</text><rect x="452" y="460" width="108" height="93" rx="8" fill="#fde68a" stroke="#94a3b8"/><text x="460" y="486" font-size="18" fill="#172554">槽位 2</text><text x="460" y="514" font-size="15" fill="#172554">k 16–23</text><text x="460" y="540" font-size="12" fill="#172554">元素 208–215</text><rect x="568" y="460" width="108" height="93" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="576" y="486" font-size="18" fill="#172554">槽位 3</text><text x="576" y="514" font-size="15" fill="#172554">k 24–31</text><text x="576" y="540" font-size="12" fill="#172554">元素 216–223</text><rect x="684" y="460" width="108" height="93" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="692" y="486" font-size="18" fill="#172554">槽位 4</text><text x="692" y="514" font-size="15" fill="#172554">k 32–39</text><text x="692" y="540" font-size="12" fill="#172554">元素 224–231</text><rect x="800" y="460" width="108" height="93" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="808" y="486" font-size="18" fill="#172554">槽位 5</text><text x="808" y="514" font-size="15" fill="#172554">k 40–47</text><text x="808" y="540" font-size="12" fill="#172554">元素 232–239</text><rect x="916" y="460" width="108" height="93" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="924" y="486" font-size="18" fill="#172554">槽位 6</text><text x="924" y="514" font-size="15" fill="#172554">k 48–55</text><text x="924" y="540" font-size="12" fill="#172554">元素 240–247</text><rect x="1032" y="460" width="108" height="93" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="1040" y="486" font-size="18" fill="#172554">槽位 7</text><text x="1040" y="514" font-size="15" fill="#172554">k 56–63</text><text x="1040" y="540" font-size="12" fill="#172554">元素 248–255</text><path d="M506,558 L390,628" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#tip)"/><text x="565" y="588" font-size="18" fill="#b91c1c">选中的逻辑 sector 2 → 物理 sector 1</text><text x="565" y="617" font-size="17" fill="#b91c1c">sector 内 u=2 保持不变</text><text x="30" y="669" font-size="17" fill="#172554">SMEM 地址顺序</text><text x="30" y="700" font-size="15" fill="#172554">槽位 = q XOR 3</text><rect x="220" y="640" width="108" height="95" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="228" y="665" font-size="16" fill="#172554">物理 p=0</text><text x="228" y="694" font-size="14" fill="#172554">装逻辑 q=3</text><text x="228" y="721" font-size="12" fill="#172554">元素 192–199</text><rect x="336" y="640" width="108" height="95" rx="8" fill="#fde68a" stroke="#94a3b8"/><text x="344" y="665" font-size="16" fill="#172554">物理 p=1</text><text x="344" y="694" font-size="14" fill="#172554">装逻辑 q=2</text><text x="344" y="721" font-size="12" fill="#172554">元素 200–207</text><rect x="452" y="640" width="108" height="95" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="460" y="665" font-size="16" fill="#172554">物理 p=2</text><text x="460" y="694" font-size="14" fill="#172554">装逻辑 q=1</text><text x="460" y="721" font-size="12" fill="#172554">元素 208–215</text><rect x="568" y="640" width="108" height="95" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="576" y="665" font-size="16" fill="#172554">物理 p=3</text><text x="576" y="694" font-size="14" fill="#172554">装逻辑 q=0</text><text x="576" y="721" font-size="12" fill="#172554">元素 216–223</text><rect x="684" y="640" width="108" height="95" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="692" y="665" font-size="16" fill="#172554">物理 p=4</text><text x="692" y="694" font-size="14" fill="#172554">装逻辑 q=7</text><text x="692" y="721" font-size="12" fill="#172554">元素 224–231</text><rect x="800" y="640" width="108" height="95" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="808" y="665" font-size="16" fill="#172554">物理 p=5</text><text x="808" y="694" font-size="14" fill="#172554">装逻辑 q=6</text><text x="808" y="721" font-size="12" fill="#172554">元素 232–239</text><rect x="916" y="640" width="108" height="95" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="924" y="665" font-size="16" fill="#172554">物理 p=6</text><text x="924" y="694" font-size="14" fill="#172554">装逻辑 q=5</text><text x="924" y="721" font-size="12" fill="#172554">元素 240–247</text><rect x="1032" y="640" width="108" height="95" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="1040" y="665" font-size="16" fill="#172554">物理 p=7</text><text x="1040" y="694" font-size="14" fill="#172554">装逻辑 q=4</text><text x="1040" y="721" font-size="12" fill="#172554">元素 248–255</text><text x="30" y="780" font-size="19" fill="#172554">放大被搬运的 sector：逻辑 k=16…23，整体从源 sector 2 放入目标 sector 1。</text><rect x="220" y="808" width="108" height="107" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="229" y="836" font-size="15" fill="#172554">逻辑 k=16</text><text x="229" y="867" font-size="14" fill="#172554">GMEM 208</text><text x="229" y="899" font-size="14" fill="#172554">SMEM 200</text><rect x="336" y="808" width="108" height="107" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="345" y="836" font-size="15" fill="#172554">逻辑 k=17</text><text x="345" y="867" font-size="14" fill="#172554">GMEM 209</text><text x="345" y="899" font-size="14" fill="#172554">SMEM 201</text><rect x="452" y="808" width="108" height="107" rx="8" fill="#fbbf24" stroke="#94a3b8"/><text x="461" y="836" font-size="15" fill="#172554">逻辑 k=18</text><text x="461" y="867" font-size="14" fill="#172554">GMEM 210</text><text x="461" y="899" font-size="14" fill="#172554">SMEM 202</text><rect x="568" y="808" width="108" height="107" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="577" y="836" font-size="15" fill="#172554">逻辑 k=19</text><text x="577" y="867" font-size="14" fill="#172554">GMEM 211</text><text x="577" y="899" font-size="14" fill="#172554">SMEM 203</text><rect x="684" y="808" width="108" height="107" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="693" y="836" font-size="15" fill="#172554">逻辑 k=20</text><text x="693" y="867" font-size="14" fill="#172554">GMEM 212</text><text x="693" y="899" font-size="14" fill="#172554">SMEM 204</text><rect x="800" y="808" width="108" height="107" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="809" y="836" font-size="15" fill="#172554">逻辑 k=21</text><text x="809" y="867" font-size="14" fill="#172554">GMEM 213</text><text x="809" y="899" font-size="14" fill="#172554">SMEM 205</text><rect x="916" y="808" width="108" height="107" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="925" y="836" font-size="15" fill="#172554">逻辑 k=22</text><text x="925" y="867" font-size="14" fill="#172554">GMEM 214</text><text x="925" y="899" font-size="14" fill="#172554">SMEM 206</text><rect x="1032" y="808" width="108" height="107" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="1041" y="836" font-size="15" fill="#172554">逻辑 k=23</text><text x="1041" y="867" font-size="14" fill="#172554">GMEM 215</text><text x="1041" y="899" font-size="14" fill="#172554">SMEM 207</text><rect x="30" y="950" width="1140" height="154" rx="8" fill="#fff7ed" stroke="#94a3b8"/><text x="48" y="983" font-size="21" fill="#172554">thread82：读取 p.a[210] 的 4 → 临时寄存器 → 写入 s.a[202]，数值仍为 4。</text><text x="48" y="1017" font-size="19" fill="#172554">GMEM 元素：192+2×8+2=210；SMEM 元素：192+1×8+2=202。</text><text x="48" y="1052" font-size="17" fill="#172554">字节偏移：420 XOR 48 = 404；404 / 2 = 202。不能对元素偏移直接套字节 swizzle。</text><text x="48" y="1084" font-size="17" fill="#172554">物理行内位置 202−192=10，不是新的逻辑 k；不能据此把搬运线程改算成 64+10=74。</text><text x="30" y="1150" font-size="17" fill="#172554">两排都按各自内存地址递增绘制。GMEM 的行主序恰好与逻辑 K 次序一致；SMEM 的 swizzle 不一致。</text><text x="30" y="1180" font-size="17" fill="#172554">A[3,18] 是两处数据共同的逻辑身份；210 与 202 是它在两个不同缓冲区中的元素偏移。</text></g></svg>