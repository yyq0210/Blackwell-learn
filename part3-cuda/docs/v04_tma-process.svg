<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img"><title>v04_tma完整计算流程</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="28.0" fill="#172554">v04_tma：从输入到输出的完整过程</text><text x="30" y="79" font-size="18.0" fill="#172554">例子 M×N×K=256×384×192；TMA输入 + 分片TMA输出</text><rect x="35" y="115" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="144" font-size="21.0" fill="#172554">1. CPU</text><text x="48" y="174" font-size="17.0" fill="#172554">创建A/B load descriptor与D store descriptor</text><text x="48" y="203" font-size="17.0" fill="#172554">get_tma_tensor生成TMA坐标视图</text><path d="M600,224 L600,261" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="265" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="294" font-size="21.0" fill="#172554">2. 输入</text><text x="48" y="324" font-size="17.0" fill="#172554">warp0选一线程，TMA搬A+B共32768bytes</text><text x="48" y="353" font-size="17.0" fill="#172554">pa/pb + sa/sb → tma_partition → ag/as、bg/bs</text><path d="M600,374 L600,411" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="415" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="444" font-size="21.0" fill="#172554">3. 等到达</text><text x="48" y="474" font-size="17.0" fill="#172554">wait full[0]，然后MMA读SMEM</text><text x="48" y="503" font-size="17.0" fill="#172554">输入到齐与输入用完是两个不同事件</text><path d="M600,524 L600,561" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="565" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="594" font-size="21.0" fill="#172554">4. 等用完</text><text x="48" y="624" font-size="17.0" fill="#172554">4次MMA后commit到done并等待</text><text x="48" y="653" font-size="17.0" fill="#172554">只有此时才能下一轮覆盖唯一输入stage</text><path d="M600,674 L600,711" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="715" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="744" font-size="21.0" fill="#172554">5. 输出ei0/1</text><text x="48" y="774" font-size="17.0" fill="#172554">TMEM→RF→RH→sd，再TMA→GMEM</text><text x="48" y="803" font-size="17.0" fill="#172554">每次128×64；fence/sync/commit/wait后复用sd</text><text x="30" y="906" font-size="17.0" fill="#172554">箭头表示依赖和代码逻辑，不是GPU时钟比例；异步提交后必须等待相应完成事件。</text></g></svg>