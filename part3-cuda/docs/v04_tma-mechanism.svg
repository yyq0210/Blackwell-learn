<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 775" role="img"><title>v04_tma关键机制</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="27.0" fill="#172554">v04_tma：本版最重要的空间或同步关系</text><rect x="35" y="125" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="154" font-size="21.0" fill="#172554">full：输入到达</text><text x="48" y="184" font-size="17.0" fill="#172554">登记 A16KiB + B16KiB = 32768bytes</text><text x="48" y="213" font-size="17.0" fill="#172554">TMA真正搬完 → full就绪 → MMA才可读SMEM</text><rect x="35" y="290" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="319" font-size="21.0" fill="#172554">done：输入已用完</text><text x="48" y="349" font-size="17.0" fill="#172554">4条MMA提交后仍可能异步执行</text><text x="48" y="378" font-size="17.0" fill="#172554">MMA真正完成 → done就绪 → 才可覆盖输入</text><rect x="35" y="455" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="484" font-size="21.0" fill="#172554">输出sd：也是一份会被复用的缓冲</text><text x="48" y="514" font-size="17.0" fill="#172554">ei0填sd → fence/sync → TMA store commit/wait</text><text x="48" y="543" font-size="17.0" fill="#172554">全CTA同步后才覆盖sd，处理ei1</text><text x="30" y="735" font-size="17.0" fill="#172554">图为当前源码的教学映射；颜色/方框不代表固定硬件执行时钟或实测耗时。</text></g></svg>