<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 775" role="img"><title>v05_double_buffer关键机制</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="27.0" fill="#172554">v05_double_buffer：本版最重要的空间或同步关系</text><rect x="35" y="110" width="1130" height="77" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="139" font-size="21.0" fill="#172554">启动</text><text x="48" y="169" font-size="17.0" fill="#172554">load kt0 → S0；等待输入</text><rect x="35" y="235" width="1130" height="77" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="264" font-size="21.0" fill="#172554">kt0</text><text x="48" y="294" font-size="17.0" fill="#172554">load kt1 → S1；MMA kt0读S0 → 等done</text><rect x="35" y="360" width="1130" height="77" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="389" font-size="21.0" fill="#172554">kt1</text><text x="48" y="419" font-size="17.0" fill="#172554">load kt2 → S0；MMA kt1读S1 → 等done</text><rect x="35" y="485" width="1130" height="77" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="514" font-size="21.0" fill="#172554">kt2</text><text x="48" y="544" font-size="17.0" fill="#172554">没有下一块；MMA kt2读S0 → 等done</text><text x="35" y="658" font-size="18.0" fill="#172554">只有两个不同缓冲能支持这种重叠；上一轮done保护当前被预取覆盖的目标。</text><text x="30" y="735" font-size="17.0" fill="#172554">图为当前源码的教学映射；颜色/方框不代表固定硬件执行时钟或实测耗时。</text></g></svg>