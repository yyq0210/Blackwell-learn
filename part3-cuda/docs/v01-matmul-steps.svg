<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 595" role="img"><title>四次 MMA 的数学分块与累加</title><rect width="1100" height="100%" fill="#f8fafc"/><g font-family="system-ui, sans-serif"><text x="30" y="38" font-size="27" fill="#172554">四段 K，更新同一块 D</text><text x="30" y="68" font-size="17" fill="#172554">A[m,k] × B[n,k]：A 的第 m 行与 B 的第 n 行做点积。B 在内存中仍按 (N,K) 存储。</text><text x="35" y="105" font-size="20" fill="#172554">A：128 × 64</text><rect x="35" y="125" width="68" height="192" rx="5" fill="#2563eb" stroke="#cbd5e1"/><text x="43" y="153" font-size="14" fill="white">K 0–</text><text x="43" y="176" font-size="14" fill="white">15</text><rect x="105" y="125" width="68" height="192" rx="5" fill="#0d9488" stroke="#cbd5e1"/><text x="113" y="153" font-size="14" fill="white">K 16–</text><text x="113" y="176" font-size="14" fill="white">31</text><rect x="175" y="125" width="68" height="192" rx="5" fill="#d97706" stroke="#cbd5e1"/><text x="183" y="153" font-size="14" fill="white">K 32–</text><text x="183" y="176" font-size="14" fill="white">47</text><rect x="245" y="125" width="68" height="192" rx="5" fill="#9333ea" stroke="#cbd5e1"/><text x="253" y="153" font-size="14" fill="white">K 48–</text><text x="253" y="176" font-size="14" fill="white">63</text><rect x="35" y="212" width="278" height="5" fill="#fef08a"/><text x="35" y="344" font-size="17" fill="#172554">黄色高亮：第 m 行的 64 个输入</text><text x="390" y="105" font-size="20" fill="#172554">B：128 × 64</text><rect x="390" y="125" width="68" height="192" rx="5" fill="#2563eb" stroke="#cbd5e1"/><text x="398" y="153" font-size="14" fill="white">K 0–</text><text x="398" y="176" font-size="14" fill="white">15</text><rect x="460" y="125" width="68" height="192" rx="5" fill="#0d9488" stroke="#cbd5e1"/><text x="468" y="153" font-size="14" fill="white">K 16–</text><text x="468" y="176" font-size="14" fill="white">31</text><rect x="530" y="125" width="68" height="192" rx="5" fill="#d97706" stroke="#cbd5e1"/><text x="538" y="153" font-size="14" fill="white">K 32–</text><text x="538" y="176" font-size="14" fill="white">47</text><rect x="600" y="125" width="68" height="192" rx="5" fill="#9333ea" stroke="#cbd5e1"/><text x="608" y="153" font-size="14" fill="white">K 48–</text><text x="608" y="176" font-size="14" fill="white">63</text><rect x="390" y="212" width="278" height="5" fill="#fef08a"/><text x="390" y="344" font-size="17" fill="#172554">黄色高亮：第 n 行的 64 个输入</text><text x="745" y="105" font-size="20" fill="#172554">acc / D：128 × 128</text><rect x="745" y="125" width="290" height="192" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="854" y="211" width="12" height="12" rx="5" fill="#e11d48" stroke="#cbd5e1"/><text x="777" y="276" font-size="18" fill="#172554">红点：一个 D[m,n]</text><text x="745" y="344" font-size="17" fill="#172554">四次都更新整块 128 × 128</text><text x="35" y="393" font-size="21" fill="#172554">放大一个结果：设 A[m,k]=1，B[n,k]=k+1</text><rect x="35" y="415" width="245" height="115" rx="5" fill="white" stroke="#2563eb"/><text x="50" y="445" font-size="18" fill="#2563eb">MMA 0 · K=[0,16)</text><text x="50" y="478" font-size="19" fill="#172554">覆盖：136</text><text x="50" y="511" font-size="20" fill="#172554">acc[m,n] = 136</text><rect x="300" y="415" width="245" height="115" rx="5" fill="white" stroke="#0d9488"/><text x="315" y="445" font-size="18" fill="#0d9488">MMA 1 · K=[16,32)</text><text x="315" y="478" font-size="19" fill="#172554">累加：392</text><text x="315" y="511" font-size="20" fill="#172554">acc[m,n] = 528</text><rect x="565" y="415" width="245" height="115" rx="5" fill="white" stroke="#d97706"/><text x="580" y="445" font-size="18" fill="#d97706">MMA 2 · K=[32,48)</text><text x="580" y="478" font-size="19" fill="#172554">累加：648</text><text x="580" y="511" font-size="20" fill="#172554">acc[m,n] = 1176</text><rect x="830" y="415" width="245" height="115" rx="5" fill="white" stroke="#9333ea"/><text x="845" y="445" font-size="18" fill="#9333ea">MMA 3 · K=[48,64)</text><text x="845" y="478" font-size="19" fill="#172554">累加：904</text><text x="845" y="511" font-size="20" fill="#172554">acc[m,n] = 2080</text><text x="35" y="567" font-size="17" fill="#172554">128×128×64 是工作块；128×128×16 是一条指令。颜色表示 K 区间，不表示四个 warp。</text></g></svg>