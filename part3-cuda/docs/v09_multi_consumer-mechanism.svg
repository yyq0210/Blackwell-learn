<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 775" role="img"><title>v09_multi_consumer关键机制</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="27.0" fill="#172554">v09_multi_consumer：本版最重要的空间或同步关系</text><rect x="35" y="110" width="550" height="106" fill="#dbeafe" stroke="#94a3b8" rx="7"/><text x="48" y="139" font-size="21.0" fill="#172554">consumer0 / peer0</text><text x="48" y="169" font-size="17.0" fill="#172554">输出行[0,128) × 列[0,256)</text><text x="48" y="198" font-size="17.0" fill="#172554">本地TMEM：TLane0…127 / TCol[0,256)</text><rect x="35" y="255" width="550" height="106" fill="#dbeafe" stroke="#94a3b8" rx="7"/><text x="48" y="284" font-size="21.0" fill="#172554">consumer0 / peer1</text><text x="48" y="314" font-size="17.0" fill="#172554">输出行[128,256) × 列[0,256)</text><text x="48" y="343" font-size="17.0" fill="#172554">本地TMEM：TLane0…127 / TCol[0,256)</text><rect x="625" y="110" width="550" height="106" fill="#ede9fe" stroke="#94a3b8" rx="7"/><text x="638" y="139" font-size="21.0" fill="#172554">consumer1 / peer0</text><text x="638" y="169" font-size="17.0" fill="#172554">输出行[256,384) × 列[0,256)</text><text x="638" y="198" font-size="17.0" fill="#172554">本地TMEM：TLane0…127 / TCol[256,512)</text><rect x="625" y="255" width="550" height="106" fill="#ede9fe" stroke="#94a3b8" rx="7"/><text x="638" y="284" font-size="21.0" fill="#172554">consumer1 / peer1</text><text x="638" y="314" font-size="17.0" fill="#172554">输出行[384,512) × 列[0,256)</text><text x="638" y="343" font-size="17.0" fill="#172554">本地TMEM：TLane0…127 / TCol[256,512)</text><rect x="35" y="440" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="469" font-size="21.0" fill="#172554">共享B的安全条件</text><text x="48" y="499" font-size="17.0" fill="#172554">每stage：A0 + A1 + B；每位consumer用完后各通知empty一次</text><text x="48" y="528" font-size="17.0" fill="#172554">empty count=2才允许重写B；两份acc_full/acc_empty则分别推进</text><text x="35" y="615" font-size="18.0" fill="#172554">D[387,133]：c1、peer1、local_m3 → thread131（copy tid3），TMEM列389，ei2。</text><text x="30" y="735" font-size="17.0" fill="#172554">图为当前源码的教学映射；颜色/方框不代表固定硬件执行时钟或实测耗时。</text></g></svg>