<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img"><title>partition 的嵌套坐标与 fragment 的描述符表示</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs><rect width="1120" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="25" y="38" font-size="26" fill="#172554">partition 改坐标层次；fragment 改操作数表示</text><rect x="30" y="90" width="310" height="110" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="42" y="118" font-size="17" fill="#172554">ga(m,k,kt)</text><text x="42" y="143" font-size="14" fill="#172554">子块内：m=3，k=18</text><text x="42" y="168" font-size="14" fill="#172554">较大演示中 kt=1</text><path d="M350,145 L485,145" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="425.5" y="137.0" font-size="13" fill="#64748b">k=16×kb+ki</text><rect x="495" y="90" width="590" height="110" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="507" y="118" font-size="17" fill="#172554">pa((m,ki),0,kb,kt)</text><text x="507" y="143" font-size="14" fill="#172554">pa((3,2),0,1,1) 与 ga(3,18,1) 指向同一元素</text><text x="507" y="168" font-size="14" fill="#172554">只有访问坐标变了；没有物理搬运</text><text x="30" y="250" font-size="20" fill="#172554">一个 K64 大块拆成四条 K16 指令：</text><rect x="30" y="275" width="250" height="110" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="42" y="303" font-size="17" fill="#172554">kb=0，K=[0,16)</text><text x="42" y="328" font-size="14" fill="#172554">ki=0..15，k=0+ki</text><text x="42" y="353" font-size="14" fill="#172554">同样覆盖全部 128 行</text><rect x="298" y="275" width="250" height="110" rx="8" fill="#fef3c7" stroke="#94a3b8"/><text x="310" y="303" font-size="17" fill="#172554">kb=1，K=[16,32)</text><text x="310" y="328" font-size="14" fill="#172554">ki=0..15，k=16+ki</text><text x="310" y="353" font-size="14" fill="#172554">包含 k=18 → ki=2</text><rect x="566" y="275" width="250" height="110" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="578" y="303" font-size="17" fill="#172554">kb=2，K=[32,48)</text><text x="578" y="328" font-size="14" fill="#172554">ki=0..15，k=32+ki</text><text x="578" y="353" font-size="14" fill="#172554">同样覆盖全部 128 行</text><rect x="834" y="275" width="250" height="110" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="846" y="303" font-size="17" fill="#172554">kb=3，K=[48,64)</text><text x="846" y="328" font-size="14" fill="#172554">ki=0..15，k=48+ki</text><text x="846" y="353" font-size="14" fill="#172554">同样覆盖全部 128 行</text><rect x="30" y="440" width="490" height="113" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="42" y="468" font-size="17" fill="#172554">sa：((128,16),1,4)</text><text x="42" y="493" font-size="14" fill="#172554">每个 K16 切片描述 128×16 个 FP16 数值</text><text x="42" y="518" font-size="14" fill="#172554">cooperative_copy 后，数值实际存入 SMEM</text><path d="M530,494 L605,494" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="615" y="440" width="470" height="113" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="627" y="468" font-size="17" fill="#172554">ra：(1,1,4)</text><text x="627" y="493" font-size="14" fill="#172554">每个 K16 切片由一个 descriptor 位置描述</text><text x="627" y="518" font-size="14" fill="#172554">ra(_,_,kb) 供一条 MMA 使用</text><text x="30" y="610" font-size="17" fill="#172554">同一数学元素可以有不同坐标表达；整个输入片可以用一个描述符指定，但输入数值没有消失。</text><text x="30" y="645" font-size="17" fill="#172554">partition_C：gd(m,n) → pd((m,n),0,0)；make_fragment_C(pd) 再建立对应的 TMEM 视图。</text></g></svg>