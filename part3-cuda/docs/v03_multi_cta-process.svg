<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img"><title>v03_multi_cta完整计算流程</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="28.0" fill="#172554">v03_multi_cta：从输入到输出的完整过程</text><text x="30" y="79" font-size="18.0" fill="#172554">例子 M×N×K=256×384×192；输出tile网格 2×3</text><rect x="35" y="115" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="144" font-size="21.0" fill="#172554">1. 启动</text><text x="48" y="174" font-size="17.0" fill="#172554">grid=(2,3)，每CTA128线程</text><text x="48" y="203" font-size="17.0" fill="#172554">bm=blockIdx.x，bn=blockIdx.y</text><path d="M600,224 L600,261" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="265" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="294" font-size="21.0" fill="#172554">2. 选块</text><text x="48" y="324" font-size="17.0" fill="#172554">CTA(1,2)选D[128:256,256:384]</text><text x="48" y="353" font-size="17.0" fill="#172554">A行128:256；B行256:384；K=192</text><path d="M600,374 L600,411" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="415" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="444" font-size="21.0" fill="#172554">3. 建视图</text><text x="48" y="474" font-size="17.0" fill="#172554">D[131,261] → 块内(3,5)</text><text x="48" y="503" font-size="17.0" fill="#172554">A[131,82] → pa((3,2),0,1,1)</text><path d="M600,524 L600,561" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="565" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="594" font-size="21.0" fill="#172554">4. 独立归约</text><text x="48" y="624" font-size="17.0" fill="#172554">每CTA独立做kt0/1/2，各4次MMA</text><text x="48" y="653" font-size="17.0" fill="#172554">SMEM、TMEM、barrier均属于各自CTA</text><path d="M600,674 L600,711" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="715" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="744" font-size="21.0" fill="#172554">5. 独立写回</text><text x="48" y="774" font-size="17.0" fill="#172554">各CTA只写自己的一格输出</text><text x="48" y="803" font-size="17.0" fill="#172554">没有跨CTA的K归约，也不需要atomic</text><text x="30" y="906" font-size="17.0" fill="#172554">箭头表示依赖和代码逻辑，不是GPU时钟比例；异步提交后必须等待相应完成事件。</text></g></svg>