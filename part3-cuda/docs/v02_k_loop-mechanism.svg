<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 775" role="img"><title>v02_k_loop关键机制</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="27.0" fill="#172554">v02_k_loop：本版最重要的空间或同步关系</text><text x="30" y="85" font-size="19.0" fill="#172554">三个K64块写入同一SMEM，并累计到同一TMEM；示例 A=1，B[k]=k+1。</text><rect x="35" y="130" width="360" height="135" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="159" font-size="21.0" fill="#172554">kt=0，K=[0,64)</text><text x="48" y="189" font-size="17.0" fill="#172554">4条K16 MMA；贡献 2080</text><text x="48" y="218" font-size="17.0" fill="#172554">完成后累计 2080</text><text x="48" y="247" font-size="17.0" fill="#172554">barrier等待 phase 0</text><rect x="420" y="130" width="360" height="135" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="433" y="159" font-size="21.0" fill="#172554">kt=1，K=[64,128)</text><text x="433" y="189" font-size="17.0" fill="#172554">4条K16 MMA；贡献 6176</text><text x="433" y="218" font-size="17.0" fill="#172554">完成后累计 8256</text><text x="433" y="247" font-size="17.0" fill="#172554">barrier等待 phase 1</text><rect x="805" y="130" width="360" height="135" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="818" y="159" font-size="21.0" fill="#172554">kt=2，K=[128,192)</text><text x="818" y="189" font-size="17.0" fill="#172554">4条K16 MMA；贡献 10272</text><text x="818" y="218" font-size="17.0" fill="#172554">完成后累计 18528</text><text x="818" y="247" font-size="17.0" fill="#172554">barrier等待 phase 0</text><rect x="35" y="340" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="369" font-size="21.0" fill="#172554">唯一的输入缓冲与唯一的结果累加器</text><text x="48" y="399" font-size="17.0" fill="#172554">SMEM：kt0输入 → 等读完 → kt1输入 → 等读完 → kt2输入</text><text x="48" y="428" font-size="17.0" fill="#172554">TMEM：第一次Zero，之后11条MMA都是One；到最后才写回</text><text x="30" y="735" font-size="17.0" fill="#172554">图为当前源码的教学映射；颜色/方框不代表固定硬件执行时钟或实测耗时。</text></g></svg>