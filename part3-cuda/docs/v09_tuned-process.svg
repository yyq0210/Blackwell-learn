<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img"><title>v09_tuned完整计算流程</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="28.0" fill="#172554">v09_tuned：从输入到输出的完整过程</text><text x="30" y="79" font-size="18.0" fill="#172554">例子 M×N×K=1024×512×192；相同计算，TMEM load 1x → 32x</text><rect x="35" y="115" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="144" font-size="21.0" fill="#172554">1. 前半段不变</text><text x="48" y="174" font-size="17.0" fill="#172554">仍2CTA、2consumer、4stage</text><text x="48" y="203" font-size="17.0" fill="#172554">MMA结果与TMEM的两个256列slot保持一致</text><path d="M600,224 L600,261" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="265" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="294" font-size="21.0" fill="#172554">2. 选ei</text><text x="48" y="324" font-size="17.0" fill="#172554">每侧结果256列，仍拆成4个64列片</text><text x="48" y="353" font-size="17.0" fill="#172554">观察c1/peer1/D[387,133]：ei2，片内列5</text><path d="M600,374 L600,411" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="415" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="444" font-size="21.0" fill="#172554">3. make_tmem_copy</text><text x="48" y="474" font-size="17.0" fill="#172554">改用32dp32b32x构造cp</text><text x="48" y="503" font-size="17.0" fill="#172554">相应src/dst/rf形状由CuTe重新推导</text><path d="M600,524 L600,561" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="565" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="594" font-size="21.0" fill="#172554">4. 宽读出</text><text x="48" y="624" font-size="17.0" fill="#172554">64列：按atom覆盖为2次32列操作</text><text x="48" y="653" font-size="17.0" fill="#172554">每线程总64个FP32，并非只需32个寄存器值</text><path d="M600,674 L600,711" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="715" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="744" font-size="21.0" fill="#172554">5. 后半段不变</text><text x="48" y="774" font-size="17.0" fill="#172554">wait::ld→转换→sd→TMA store→回收</text><text x="48" y="803" font-size="17.0" fill="#172554">实际有LDTM.x32；是否更快仍看完整实测</text><text x="30" y="906" font-size="17.0" fill="#172554">箭头表示依赖和代码逻辑，不是GPU时钟比例；异步提交后必须等待相应完成事件。</text></g></svg>