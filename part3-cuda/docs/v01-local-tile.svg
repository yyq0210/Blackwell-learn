<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 725" role="img"><title>make_coord 和 local_tile 的投影与窗口</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs><rect width="1120" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="25" y="38" font-size="25" fill="#172554">local_tile：coord=(1,2,_)，同一数学块在 A/B/D 中的窗口</text><text x="25" y="73" font-size="16" fill="#172554">演示尺寸 M=384、N=512、K=128；每格表示一个 128×64 输入块或 128×128 输出块。</text><text x="35" y="120" font-size="21" fill="#172554">A：M × K</text><rect x="35" y="155" width="120" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="47" y="183" font-size="17" fill="#172554">(0,0)</text><rect x="160" y="155" width="120" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="172" y="183" font-size="17" fill="#172554">(0,1)</text><rect x="35" y="225" width="120" height="65" rx="8" fill="#fde68a" stroke="#94a3b8"/><text x="47" y="253" font-size="17" fill="#172554">(1,0)</text><rect x="160" y="225" width="120" height="65" rx="8" fill="#fde68a" stroke="#94a3b8"/><text x="172" y="253" font-size="17" fill="#172554">(1,1)</text><rect x="35" y="295" width="120" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="47" y="323" font-size="17" fill="#172554">(2,0)</text><rect x="160" y="295" width="120" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="172" y="323" font-size="17" fill="#172554">(2,1)</text><text x="35" y="395" font-size="16" fill="#172554">保留两个 K64 块</text><text x="360" y="120" font-size="21" fill="#172554">B：N × K</text><rect x="360" y="155" width="120" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="372" y="183" font-size="17" fill="#172554">(0,0)</text><rect x="485" y="155" width="120" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="497" y="183" font-size="17" fill="#172554">(0,1)</text><rect x="360" y="225" width="120" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="372" y="253" font-size="17" fill="#172554">(1,0)</text><rect x="485" y="225" width="120" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="497" y="253" font-size="17" fill="#172554">(1,1)</text><rect x="360" y="295" width="120" height="65" rx="8" fill="#fde68a" stroke="#94a3b8"/><text x="372" y="323" font-size="17" fill="#172554">(2,0)</text><rect x="485" y="295" width="120" height="65" rx="8" fill="#fde68a" stroke="#94a3b8"/><text x="497" y="323" font-size="17" fill="#172554">(2,1)</text><rect x="360" y="365" width="120" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="372" y="393" font-size="17" fill="#172554">(3,0)</text><rect x="485" y="365" width="120" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="497" y="393" font-size="17" fill="#172554">(3,1)</text><text x="360" y="465" font-size="16" fill="#172554">保留两个 K64 块</text><text x="685" y="120" font-size="21" fill="#172554">D：M × N</text><rect x="685" y="155" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="697" y="183" font-size="17" fill="#172554">(0,0)</text><rect x="775" y="155" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="787" y="183" font-size="17" fill="#172554">(0,1)</text><rect x="865" y="155" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="877" y="183" font-size="17" fill="#172554">(0,2)</text><rect x="955" y="155" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="967" y="183" font-size="17" fill="#172554">(0,3)</text><rect x="685" y="225" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="697" y="253" font-size="17" fill="#172554">(1,0)</text><rect x="775" y="225" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="787" y="253" font-size="17" fill="#172554">(1,1)</text><rect x="865" y="225" width="85" height="65" rx="8" fill="#fde68a" stroke="#94a3b8"/><text x="877" y="253" font-size="17" fill="#172554">(1,2)</text><rect x="955" y="225" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="967" y="253" font-size="17" fill="#172554">(1,3)</text><rect x="685" y="295" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="697" y="323" font-size="17" fill="#172554">(2,0)</text><rect x="775" y="295" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="787" y="323" font-size="17" fill="#172554">(2,1)</text><rect x="865" y="295" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="877" y="323" font-size="17" fill="#172554">(2,2)</text><rect x="955" y="295" width="85" height="65" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="967" y="323" font-size="17" fill="#172554">(2,3)</text><text x="685" y="395" font-size="16" fill="#172554">仅选择一个输出 tile</text><text x="35" y="500" font-size="18" fill="#172554">A 忽略 bn：保留 (M,K)；B 忽略 bm：保留 (N,K)；D 忽略 K：保留 (M,N)。</text><rect x="35" y="530" width="1020" height="118" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="47" y="558" font-size="17" fill="#172554">ga(3,18,1) = A[1×128+3, 1×64+18] = A[131,82]</text><text x="47" y="583" font-size="14" fill="#172554">gb(5,18,1) = B[2×128+5, 1×64+18] = B[261,82]</text><text x="47" y="608" font-size="14" fill="#172554">gd(3,5) = D[1×128+3, 2×128+5] = D[131,261]</text><text x="35" y="690" font-size="16" fill="#172554">图中的 (row,col) 是块编号。_ 使 ga/gb 保留 K 块轴；它不会自动启动两个 K 任务。</text></g></svg>