94a3b8" rx="7"/><rect x="1137.5" y="145" width="16" height="55" fill="#dbeafe" stroke="#94a3b8" rx="7"/><text x="35" y="129" font-size="18.0" fill="#172554">1x：每个基础操作取1列，覆盖64列需要64份atom工作</text><rect x="35" y="270" width="555" height="106" fill="#ede9fe" stroke="#94a3b8" rx="7"/><text x="48" y="299" font-size="21.0" fill="#172554">32x 操作 0</text><text x="48" y="329" font-size="17.0" fill="#172554">片内列 [0,32)</text><text x="48" y="358" font-size="17.0" fill="#172554">每lane接收32个FP32</text><rect x="605" y="270" width="555" height="106" fill="#ede9fe" stroke="#94a3b8" rx="7"/><text x="618" y="299" font-size="21.0" fill="#172554">32x 操作 1</text><text x="618" y="329" font-size="17.0" fill="#172554">片内列 [32,64)</text><text x="618" y="358" font-size="17.0" fill="#172554">每lane接收32个FP32</text><text x="35" y="243" font-size="18.0" fill="#172554">32x：每个基础操作取32列，同样64列用两份atom工作覆盖</text><rect x="35" y="470" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="499" font-size="21.0" fill="#172554">形状改变，总数据量不变</text><text x="48" y="529" font-size="17.0" fill="#172554">窄fragment：每次1值 × 64重复；宽fragment：每次32值 × 2重复</text><text x="48" y="558" font-size="17.0" fill="#172554">仍需要wait::ld、转换、输出SMEM、TMA store与回收；不是整个kernel加速32倍</text><text x="30" y="735" font-size="17.0" fill="#172554">图为当前源码的教学映射；颜色/方框不代表固定硬件执行时钟或实测耗时。</text></g></svg>