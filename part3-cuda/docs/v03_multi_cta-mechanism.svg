<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 775" role="img"><title>v03_multi_cta关键机制</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="27.0" fill="#172554">v03_multi_cta：本版最重要的空间或同步关系</text><text x="30" y="85" font-size="18.0" fill="#172554">M=256,N=384：每格128×128，六CTA写不同输出；同列共用B、同行共用A的数学范围。</text><rect x="40" y="130" width="345" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="53" y="159" font-size="21.0" fill="#172554">CTA(0,0)</text><text x="53" y="189" font-size="17.0" fill="#172554">D行[0,128)</text><text x="53" y="218" font-size="17.0" fill="#172554">D列[0,128)</text><rect x="420" y="130" width="345" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="433" y="159" font-size="21.0" fill="#172554">CTA(0,1)</text><text x="433" y="189" font-size="17.0" fill="#172554">D行[0,128)</text><text x="433" y="218" font-size="17.0" fill="#172554">D列[128,256)</text><rect x="800" y="130" width="345" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="813" y="159" font-size="21.0" fill="#172554">CTA(0,2)</text><text x="813" y="189" font-size="17.0" fill="#172554">D行[0,128)</text><text x="813" y="218" font-size="17.0" fill="#172554">D列[256,384)</text><rect x="40" y="280" width="345" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="53" y="309" font-size="21.0" fill="#172554">CTA(1,0)</text><text x="53" y="339" font-size="17.0" fill="#172554">D行[128,256)</text><text x="53" y="368" font-size="17.0" fill="#172554">D列[0,128)</text><rect x="420" y="280" width="345" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="433" y="309" font-size="21.0" fill="#172554">CTA(1,1)</text><text x="433" y="339" font-size="17.0" fill="#172554">D行[128,256)</text><text x="433" y="368" font-size="17.0" fill="#172554">D列[128,256)</text><rect x="800" y="280" width="345" height="106" fill="#fde68a" stroke="#94a3b8" rx="7"/><text x="813" y="309" font-size="21.0" fill="#172554">CTA(1,2)</text><text x="813" y="339" font-size="17.0" fill="#172554">D行[128,256)</text><text x="813" y="368" font-size="17.0" fill="#172554">D列[256,384)</text><text x="35" y="510" font-size="19.0" fill="#172554">每个CTA内独立完成全部K，没有跨CTA归约；硬件可以按不同顺序运行这些CTA。</text><text x="30" y="735" font-size="17.0" fill="#172554">图为当前源码的教学映射；颜色/方框不代表固定硬件执行时钟或实测耗时。</text></g></svg>