<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1595" role="img"><title>v01 的 bm/bn/nk、布局视图与完整数据计算过程</title><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="29" fill="#172554">v01 全过程：始终追踪 A[3,18] 与 D[3,5]</text><text x="30" y="78" font-size="18" fill="#172554">固定 M=N=128、K=64；1 个 CTA、128 个线程。示例 A[3,k]=4，B[5,k]=2(k+1)。</text><rect x="30" y="104" width="1140" height="106" rx="8" fill="#fef3c7" stroke="#94a3b8"/><text x="48" y="135" font-size="20" fill="#172554">bm=0、bn=0：唯一输出块；nk=1：只有一个 K64 大块；kt=0；kb=0,1,2,3。</text><text x="48" y="167" font-size="18" fill="#172554">块内输入 k = 16×kb + ki：18 = 16×1 + 2。nk 是块的数量，kt/kb 才是循环编号。</text><text x="48" y="196" font-size="16" fill="#172554">蓝色框建立视图 / 地址；橙色框搬运数据或计算。acc 的中间数值是数学解释，须等完成后才能读取。</text><rect x="30" y="242" width="1140" height="136" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="46" y="271" font-size="21" fill="#172554">① CPU 构造完整矩阵视图</text><text x="46" y="308" font-size="17" fill="#172554">a/b：(128,64):(64,1)</text><text x="46" y="337" font-size="17" fill="#172554">d：(128,128):(128,1)</text><path d="M492,284 L492,364" stroke="#cbd5e1"/><text x="515" y="301" font-size="16" fill="#172554">a(3,18) → GMEM p.a[210]，数值 4</text><text x="515" y="330" font-size="16" fill="#172554">b(5,18) → GMEM p.b[338]，数值 38</text><text x="515" y="359" font-size="16" fill="#172554">d(3,5) → GMEM p.d[389]，尚未写结果</text><path d="M600,380 L600,399" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tip)"/><rect x="30" y="402" width="1140" height="136" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="46" y="431" font-size="21" fill="#172554">② 选输出块，保留 K64 块轴</text><text x="46" y="468" font-size="17" fill="#172554">coord = make_coord(0,0,_)</text><text x="46" y="497" font-size="17" fill="#172554">local_tile → ga / gb / gd</text><path d="M492,444 L492,524" stroke="#cbd5e1"/><text x="515" y="461" font-size="16" fill="#172554">ga(3,18,0) 仍是 A[3,18]</text><text x="515" y="490" font-size="16" fill="#172554">ga/gb shape=(128,64,1)；gd=(128,128)</text><text x="515" y="519" font-size="16" fill="#172554">bm/bn 选位置；最后的 1 是 K64 块数量</text><path d="M600,540 L600,559" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tip)"/><rect x="30" y="562" width="1140" height="136" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="46" y="591" font-size="21" fill="#172554">③ MMA 分层坐标 + 操作数视图</text><text x="46" y="628" font-size="17" fill="#172554">cta = mma.get_slice(0)</text><text x="46" y="657" font-size="17" fill="#172554">partition_* + make_fragment_*</text><path d="M492,604 L492,684" stroke="#cbd5e1"/><text x="515" y="621" font-size="16" fill="#172554">pa((3,2),0,1,0) 仍指向 GMEM A[3,18]</text><text x="515" y="650" font-size="16" fill="#172554">sa((3,2),0,1) 指定其目标 SMEM 位置</text><text x="515" y="679" font-size="16" fill="#172554">ra(0,0,1) 描述第二个 K16 输入片；acc 是 TMEM 视图</text><path d="M600,700 L600,719" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tip)"/><rect x="30" y="722" width="1140" height="136" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="46" y="751" font-size="21" fill="#172554">④ 申请 TMEM，绑定结果地址</text><text x="46" y="788" font-size="17" fill="#172554">warp0：allocate(128,&amp;s.tmem)</text><text x="46" y="817" font-size="17" fill="#172554">thread0 初始化 barrier；CTA 同步</text><path d="M492,764 L492,844" stroke="#cbd5e1"/><text x="515" y="781" font-size="16" fill="#172554">申请的是 128 列 TMEM，不是 128 个线程</text><text x="515" y="810" font-size="16" fill="#172554">acc.data()=s.tmem；此时 acc 数值仍未初始化</text><text x="515" y="839" font-size="16" fill="#172554">ScaleOut::Zero 让第一条 MMA 忽略旧累加值</text><path d="M600,860 L600,879" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tip)"/><rect x="30" y="882" width="1140" height="136" rx="8" fill="#fff7ed" stroke="#94a3b8"/><text x="46" y="911" font-size="21" fill="#172554">⑤ 128 线程装入整个 A/B tile</text><text x="46" y="948" font-size="17" fill="#172554">cooperative_copy&lt;128&gt;(t,pa,sa)</text><text x="46" y="977" font-size="17" fill="#172554">shared proxy fence + __syncthreads</text><path d="M492,924 L492,1004" stroke="#cbd5e1"/><text x="515" y="941" font-size="16" fill="#172554">thread82 搬 A[3,18]：p.a[210] → s.a[202]</text><text x="515" y="970" font-size="16" fill="#172554">同一线程也搬 B[5,18]：p.b[338] → s.b[378]</text><text x="515" y="999" font-size="16" fill="#172554">此处 SMEM 地址示例采用 1024-byte 对齐起点</text><path d="M600,1020 L600,1039" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tip)"/><rect x="30" y="1042" width="1140" height="136" rx="8" fill="#fff7ed" stroke="#94a3b8"/><text x="46" y="1071" font-size="21" fill="#172554">⑥ kt=0 内，warp0 提交 4 次 MMA</text><text x="46" y="1108" font-size="17" fill="#172554">kb=0 → 1 → 2 → 3</text><text x="46" y="1137" font-size="17" fill="#172554">每条都覆盖同一块 128×128 acc</text><path d="M492,1084 L492,1164" stroke="#cbd5e1"/><text x="515" y="1101" font-size="16" fill="#172554">K[0,16)：1088；再加 3136 → 4224</text><text x="515" y="1130" font-size="16" fill="#172554">再加 K[32,48) 的 5184 → 9408</text><text x="515" y="1159" font-size="16" fill="#172554">再加 K[48,64) 的 7232 → 16640</text><path d="M600,1180 L600,1199" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tip)"/><rect x="30" y="1202" width="1140" height="136" rx="8" fill="#fff7ed" stroke="#94a3b8"/><text x="46" y="1231" font-size="21" fill="#172554">⑦ 完成等待，再把 TMEM 读到 REG</text><text x="46" y="1268" font-size="17" fill="#172554">umma_arrive + wait_barrier(phase=0)</text><text x="46" y="1297" font-size="17" fill="#172554">make_tmem_copy → get_slice(t)</text><path d="M492,1244 L492,1324" stroke="#cbd5e1"/><text x="515" y="1261" font-size="16" fill="#172554">cp.get_slice(3)：warp0/lane3 的 copy 份额</text><text x="515" y="1290" font-size="16" fill="#172554">src：warp0 协作窗口；dst：D 第 3 行</text><text x="515" y="1319" font-size="16" fill="#172554">copy + wait::ld 后，thread3 的 rf[5]=16640</text><path d="M600,1340 L600,1359" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tip)"/><rect x="30" y="1362" width="1140" height="136" rx="8" fill="#fff7ed" stroke="#94a3b8"/><text x="46" y="1391" font-size="21" fill="#172554">⑧ 转换、写回并释放</text><text x="46" y="1428" font-size="17" fill="#172554">rh[i]=H(rf[i])；copy(rh,dst)</text><text x="46" y="1457" font-size="17" fill="#172554">全 CTA 同步；warp0 释放 TMEM</text><path d="M492,1404 L492,1484" stroke="#cbd5e1"/><text x="515" y="1421" font-size="16" fill="#172554">thread3：rh[5] → GMEM D[3,5] = p.d[389]</text><text x="515" y="1450" font-size="16" fill="#172554">全部 128 线程合作写完 16384 个 FP16 结果</text><text x="515" y="1479" font-size="16" fill="#172554">A[3,18] 只是 64 项点积中的一个输入，并非完整结果</text><text x="30" y="1562" font-size="17" fill="#172554">关键：ga → pa 只改变看待数据的坐标方式；pa → sa 才搬数据；ra 描述输入，acc 存累计结果。</text></g></svg>