<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 850" role="img"><title>CuTe API 输入、计算与结果路线</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs><rect width="1120" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="25" y="38" font-size="26" fill="#172554">API 接力：先描述访问方式，再执行搬运与计算</text><text x="25" y="73" font-size="16" fill="#172554">蓝框：视图 / 配置；橙框：实际数据动作。连线主要表示依赖，不表示每一步都复制矩阵。</text><text x="25" y="113" font-size="21" fill="#172554">A/B 输入路线</text><text x="395" y="113" font-size="21" fill="#172554">MMA 操作数路线</text><text x="765" y="113" font-size="21" fill="#172554">结果读取路线</text><rect x="25" y="135" width="330" height="96" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="37" y="163" font-size="17" fill="#172554">make_coord(bm,bn,_)</text><text x="37" y="188" font-size="14" fill="#172554">组装数学块坐标</text><path d="M190,232 L190,266" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="25" y="267" width="330" height="96" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="37" y="295" font-size="17" fill="#172554">local_tile(a/b,Tile,coord,Step)</text><text x="37" y="320" font-size="14" fill="#172554">完整 GMEM → 子块视图 ga/gb</text><path d="M190,364 L190,398" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="25" y="399" width="330" height="96" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="37" y="427" font-size="17" fill="#172554">cta.partition_A/B(ga/gb)</text><text x="37" y="452" font-size="14" fill="#172554">ga/gb → MMA 层次视图 pa/pb</text><path d="M190,496 L190,530" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="25" y="531" width="330" height="96" rx="8" fill="#ffedd5" stroke="#94a3b8"/><text x="37" y="559" font-size="17" fill="#172554">cooperative_copy&lt;128&gt;(t,pa,sa)</text><text x="37" y="584" font-size="14" fill="#172554">128 线程按各自份额搬 GMEM → SMEM</text><rect x="395" y="135" width="330" height="96" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="407" y="163" font-size="17" fill="#172554">mma.get_slice(0)</text><text x="407" y="188" font-size="14" fill="#172554">本版唯一 CTA 的 MMA 接口</text><path d="M560,232 L560,266" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="395" y="267" width="330" height="96" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="407" y="295" font-size="17" fill="#172554">make_tensor(smem_ptr,LA)</text><text x="407" y="320" font-size="14" fill="#172554">sa/sb：地址 + swizzled layout</text><path d="M560,364 L560,398" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="395" y="399" width="330" height="96" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="407" y="427" font-size="17" fill="#172554">cta.make_fragment_A/B(sa/sb)</text><text x="407" y="452" font-size="14" fill="#172554">ra/rb：描述完整输入片的 descriptor</text><path d="M560,496 L560,530" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="395" y="531" width="330" height="96" rx="8" fill="#ffedd5" stroke="#94a3b8"/><text x="407" y="559" font-size="17" fill="#172554">gemm(mma,ra,rb,acc)</text><text x="407" y="584" font-size="14" fill="#172554">warp0 发射；计算单元读取 SMEM</text><rect x="765" y="135" width="330" height="96" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="777" y="163" font-size="17" fill="#172554">cta.make_fragment_C(pd)</text><text x="777" y="188" font-size="14" fill="#172554">acc：TMEM 视图；还需申请/绑定</text><path d="M930,232 L930,266" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="765" y="267" width="330" height="96" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="777" y="295" font-size="17" fill="#172554">make_tmem_copy(load_atom,acc)</text><text x="777" y="320" font-size="14" fill="#172554">cp：推导 copy 的线程/数值映射</text><path d="M930,364 L930,398" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="765" y="399" width="330" height="96" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="777" y="427" font-size="17" fill="#172554">cp.get_slice(t)</text><text x="777" y="452" font-size="14" fill="#172554">th：本 CUDA 线程的 copy 接口</text><path d="M930,496 L930,530" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="765" y="531" width="330" height="96" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="777" y="559" font-size="17" fill="#172554">th.partition_S(acc) / _D(pd)</text><text x="777" y="584" font-size="14" fill="#172554">源协作窗口 / 本线程目标位置</text><rect x="25" y="690" width="1065" height="98" rx="8" fill="#fff7ed" stroke="#94a3b8"/><text x="37" y="718" font-size="17" fill="#172554">真正的数据路径：GMEM → SMEM → Tensor Core → TMEM → RF → RH → GMEM D</text><text x="37" y="743" font-size="14" fill="#172554">cooperative_copy 搬入；gemm 计算；copy(cp,src,rf) 读出；FP32→FP16 转换；copy(rh,dst) 写回。</text><text x="25" y="646" font-size="16" fill="#172554">D 路线：local_tile(d) → gd → cta.partition_C(gd) → pd；pd 同时提供 acc 的逻辑形状和写回目标。</text><text x="25" y="822" font-size="16" fill="#172554">make_fragment_A/B 不把 FP16 矩阵搬进寄存器；make_fragment_C 不把 D 的旧值加载进 TMEM。</text></g></svg>