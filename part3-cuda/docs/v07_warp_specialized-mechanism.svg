<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 775" role="img"><title>v07_warp_specialized关键机制</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="27.0" fill="#172554">v07_warp_specialized：本版最重要的空间或同步关系</text><rect x="35" y="110" width="1130" height="77" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="139" font-size="21.0" fill="#172554">线程角色</text><text x="48" y="169" font-size="17.0" fill="#172554">WG0/thread0–127：写回；warp4/thread128–159：MMA；warp7/thread224–255：TMA</text><rect x="35" y="265" width="535" height="135" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="294" font-size="21.0" fill="#172554">输入SMEM环</text><text x="48" y="324" font-size="17.0" fill="#172554">TMA → full[st] → MMA</text><text x="48" y="353" font-size="17.0" fill="#172554">MMA完成 → empty[st] → TMA</text><text x="48" y="382" font-size="17.0" fill="#172554">4槽；按连续iteration选stage</text><rect x="630" y="265" width="535" height="135" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="643" y="294" font-size="21.0" fill="#172554">输出TMEM槽</text><text x="643" y="324" font-size="17.0" fill="#172554">MMA整段K完成 → acc_full</text><text x="643" y="353" font-size="17.0" fill="#172554">WG0读出/写回 → acc_empty</text><text x="643" y="382" font-size="17.0" fill="#172554">128个写回线程归还这个槽</text><rect x="35" y="480" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="509" font-size="21.0" fill="#172554">两种回收允许不同角色重叠</text><text x="48" y="539" font-size="17.0" fill="#172554">输入stage空闲：producer可预取下个输出</text><text x="48" y="568" font-size="17.0" fill="#172554">结果TMEM未空闲：MMA仍必须等acc_empty；不能把empty当作acc_empty</text><text x="30" y="735" font-size="17.0" fill="#172554">图为当前源码的教学映射；颜色/方框不代表固定硬件执行时钟或实测耗时。</text></g></svg>