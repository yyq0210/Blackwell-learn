<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 775" role="img"><title>v08_two_cta关键机制</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="27.0" fill="#172554">v08_two_cta：本版最重要的空间或同步关系</text><rect x="35" y="110" width="550" height="135" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="139" font-size="21.0" fill="#172554">peer0 / 本侧SM</text><text x="48" y="169" font-size="17.0" fill="#172554">A行 0…127，B行同范围</text><text x="48" y="198" font-size="17.0" fill="#172554">本地输入32KiB/stage × 6</text><text x="48" y="227" font-size="17.0" fill="#172554">输出：本侧128行 × 全部256列</text><rect x="625" y="110" width="550" height="135" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="638" y="139" font-size="21.0" fill="#172554">peer1 / 本侧SM</text><text x="638" y="169" font-size="17.0" fill="#172554">A行 128…255，B行同范围</text><text x="638" y="198" font-size="17.0" fill="#172554">本地输入32KiB/stage × 6</text><text x="638" y="227" font-size="17.0" fill="#172554">输出：本侧128行 × 全部256列</text><rect x="35" y="335" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="364" font-size="21.0" fill="#172554">跨侧乘积例子 D[3,133]</text><text x="48" y="394" font-size="17.0" fill="#172554">A[3,k]来自peer0，B[133,k]来自peer1；结果属于peer0的TMEM</text><text x="48" y="423" font-size="17.0" fill="#172554">leader warp4发一次合作MMA；两侧WG0各自写回本地结果</text><rect x="35" y="510" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="539" font-size="21.0" fill="#172554">通知路径</text><text x="48" y="569" font-size="17.0" fill="#172554">full期望65536bytes；empty/acc_full完成通知multicast到两侧</text><text x="48" y="598" font-size="17.0" fill="#172554">各侧empty count=1；acc_empty由两侧128+128线程在leader归还</text><text x="30" y="735" font-size="17.0" fill="#172554">图为当前源码的教学映射；颜色/方框不代表固定硬件执行时钟或实测耗时。</text></g></svg>