<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img"><title>v09_multi_consumer完整计算流程</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="28.0" fill="#172554">v09_multi_consumer：从输入到输出的完整过程</text><text x="30" y="79" font-size="18.0" fill="#172554">例子 M×N×K=1024×512×192；两A共用一B，两个独立MMA warp</text><rect x="35" y="115" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="144" font-size="21.0" fill="#172554">1. 512×256任务</text><text x="48" y="174" font-size="17.0" fill="#172554">bm → 两个consumer的256行tile</text><text x="48" y="203" font-size="17.0" fill="#172554">c选A/acc；peer再选每侧128行</text><path d="M600,224 L600,261" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="265" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="294" font-size="21.0" fill="#172554">2. 输入共享</text><text x="48" y="324" font-size="17.0" fill="#172554">每stage每侧2A+1B=48KiB</text><text x="48" y="353" font-size="17.0" fill="#172554">两侧producer合计98304bytes，S=4</text><path d="M600,374 L600,411" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="415" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="444" font-size="21.0" fill="#172554">3. 独立MMA</text><text x="48" y="474" font-size="17.0" fill="#172554">leader warp8算c0，warp9算c1</text><text x="48" y="503" font-size="17.0" fill="#172554">每个consumer独立推进同一任务的K循环</text><path d="M600,524 L600,561" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="565" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="594" font-size="21.0" fill="#172554">4. 安全复用B</text><text x="48" y="624" font-size="17.0" fill="#172554">每consumer用完后各通知empty一次</text><text x="48" y="653" font-size="17.0" fill="#172554">count=2：少一位都不能覆盖共享B</text><path d="M600,674 L600,711" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="715" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="744" font-size="21.0" fill="#172554">5. 独立写回</text><text x="48" y="774" font-size="17.0" fill="#172554">WG0写c0，WG1写c1，各有sd/acc_full</text><text x="48" y="803" font-size="17.0" fill="#172554">各acc_empty分别收集两侧256线程</text><text x="30" y="906" font-size="17.0" fill="#172554">箭头表示依赖和代码逻辑，不是GPU时钟比例；异步提交后必须等待相应完成事件。</text></g></svg>