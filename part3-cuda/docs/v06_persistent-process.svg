<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img"><title>v06_persistent完整计算流程</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="28.0" fill="#172554">v06_persistent：从输入到输出的完整过程</text><text x="30" y="79" font-size="18.0" fill="#172554">例子 M×N×K=2048×2048×192；CTA0：ti0 → ti148（148SM例子）</text><rect x="35" y="115" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="144" font-size="21.0" fill="#172554">1. 一次初始化</text><text x="48" y="174" font-size="17.0" fill="#172554">启动min(tile数量,SM数量)个CTA</text><text x="48" y="203" font-size="17.0" fill="#172554">同一CTA循环复用SMEM/TMEM/barrier</text><path d="M600,224 L600,261" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="265" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="294" font-size="21.0" fill="#172554">2. 任务ti0</text><text x="48" y="324" font-size="17.0" fill="#172554">grouped_tile→(bm0,bn0)</text><text x="48" y="353" font-size="17.0" fill="#172554">Zero→完整K循环→ei写回；保留barrier历史</text><path d="M600,374 L600,411" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="415" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="444" font-size="21.0" fill="#172554">3. 任务ti148</text><text x="48" y="474" font-size="17.0" fill="#172554">148SM示例：CTA0下一任务</text><text x="48" y="503" font-size="17.0" fill="#172554">16×16网格中映射为(bm12,bn2)</text><path d="M600,524 L600,561" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="565" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="594" font-size="21.0" fill="#172554">4. 重用</text><text x="48" y="624" font-size="17.0" fill="#172554">换ga/gb/gd；同一物理输入与结果缓冲</text><text x="48" y="653" font-size="17.0" fill="#172554">acc重新Zero；full phase不能简单全部重置0</text><path d="M600,674 L600,711" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="715" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="744" font-size="21.0" fill="#172554">5. 退出</text><text x="48" y="774" font-size="17.0" fill="#172554">所有分配给此CTA的任务写完后释放</text><text x="48" y="803" font-size="17.0" fill="#172554">逻辑顺序用于局部性，不固定实际SM调度</text><text x="30" y="906" font-size="17.0" fill="#172554">箭头表示依赖和代码逻辑，不是GPU时钟比例；异步提交后必须等待相应完成事件。</text></g></svg>