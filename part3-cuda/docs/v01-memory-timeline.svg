<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img"><title>四个 warp 的职责和同步顺序</title><rect width="1100" height="100%" fill="#f8fafc"/><g font-family="system-ui, sans-serif"><text x="30" y="38" font-size="27" fill="#172554">先准备数据，再提交计算，等待后写回</text><rect x="30" y="80" width="180" height="110" rx="5" fill="white" stroke="#cbd5e1"/><text x="42" y="112" font-size="21" fill="#172554">GMEM</text><text x="42" y="147" font-size="15" fill="#172554">A、B 各 16 KiB</text><text x="216" y="140" font-size="25" fill="#172554">→</text><rect x="245" y="80" width="180" height="110" rx="5" fill="white" stroke="#cbd5e1"/><text x="257" y="112" font-size="21" fill="#172554">SMEM</text><text x="257" y="147" font-size="15" fill="#172554">A、B 各 16 KiB</text><text x="431" y="140" font-size="25" fill="#172554">→</text><rect x="460" y="80" width="180" height="110" rx="5" fill="white" stroke="#cbd5e1"/><text x="472" y="112" font-size="21" fill="#172554">Tensor Core</text><text x="472" y="147" font-size="15" fill="#172554">4 × MMA K16</text><text x="646" y="140" font-size="25" fill="#172554">→</text><rect x="675" y="80" width="180" height="110" rx="5" fill="white" stroke="#cbd5e1"/><text x="687" y="112" font-size="21" fill="#172554">TMEM</text><text x="687" y="147" font-size="15" fill="#172554">128×128 FP32</text><text x="861" y="140" font-size="25" fill="#172554">→</text><rect x="890" y="80" width="180" height="110" rx="5" fill="white" stroke="#cbd5e1"/><text x="902" y="112" font-size="21" fill="#172554">REG → GMEM</text><text x="902" y="147" font-size="15" fill="#172554">FP32 → FP16</text><text x="30" y="223" font-size="16" fill="#172554">普通 load/store；按 LA 写入 SMEM       descriptor 引导读取       结果累加       tcgen05.ld 后再写 D</text><text x="172" y="290" font-size="14" fill="#172554">申请 / 初始化</text><text x="299" y="290" font-size="14" fill="#172554">搬 A、B</text><text x="426" y="290" font-size="14" fill="#172554">可见性 + 集合</text><text x="553" y="290" font-size="14" fill="#172554">提交 4 次 MMA</text><text x="680" y="290" font-size="14" fill="#172554">等待计算完成</text><text x="807" y="290" font-size="14" fill="#172554">读取 / 转换 / 写回</text><text x="934" y="290" font-size="14" fill="#172554">集合 / 释放</text><text x="28" y="343" font-size="20" fill="#172554">warp 0</text><rect x="165" y="312" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="172" y="342" font-size="13" fill="#172554">分配 + 初始化</text><rect x="292" y="312" width="120" height="48" rx="5" fill="#dbeafe" stroke="#cbd5e1"/><text x="299" y="342" font-size="13" fill="#172554">合作搬运</text><rect x="419" y="312" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="426" y="342" font-size="13" fill="#172554">fence + sync</text><rect x="546" y="312" width="120" height="48" rx="5" fill="#ede9fe" stroke="#cbd5e1"/><text x="553" y="342" font-size="13" fill="#172554">issue</text><rect x="673" y="312" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="680" y="342" font-size="13" fill="#172554">wait mma</text><rect x="800" y="312" width="120" height="48" rx="5" fill="#dbeafe" stroke="#cbd5e1"/><text x="807" y="342" font-size="13" fill="#172554">TMEM → D</text><rect x="927" y="312" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="934" y="342" font-size="13" fill="#172554">sync + free</text><text x="28" y="411" font-size="20" fill="#172554">warp 1</text><rect x="165" y="380" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="172" y="410" font-size="13" fill="#172554">等初始化</text><rect x="292" y="380" width="120" height="48" rx="5" fill="#dbeafe" stroke="#cbd5e1"/><text x="299" y="410" font-size="13" fill="#172554">合作搬运</text><rect x="419" y="380" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="426" y="410" font-size="13" fill="#172554">fence + sync</text><rect x="546" y="380" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="553" y="410" font-size="13" fill="#172554">等待</text><rect x="673" y="380" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="680" y="410" font-size="13" fill="#172554">wait mma</text><rect x="800" y="380" width="120" height="48" rx="5" fill="#dbeafe" stroke="#cbd5e1"/><text x="807" y="410" font-size="13" fill="#172554">TMEM → D</text><rect x="927" y="380" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="934" y="410" font-size="13" fill="#172554">sync</text><text x="28" y="479" font-size="20" fill="#172554">warp 2</text><rect x="165" y="448" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="172" y="478" font-size="13" fill="#172554">等初始化</text><rect x="292" y="448" width="120" height="48" rx="5" fill="#dbeafe" stroke="#cbd5e1"/><text x="299" y="478" font-size="13" fill="#172554">合作搬运</text><rect x="419" y="448" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="426" y="478" font-size="13" fill="#172554">fence + sync</text><rect x="546" y="448" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="553" y="478" font-size="13" fill="#172554">等待</text><rect x="673" y="448" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="680" y="478" font-size="13" fill="#172554">wait mma</text><rect x="800" y="448" width="120" height="48" rx="5" fill="#dbeafe" stroke="#cbd5e1"/><text x="807" y="478" font-size="13" fill="#172554">TMEM → D</text><rect x="927" y="448" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="934" y="478" font-size="13" fill="#172554">sync</text><text x="28" y="547" font-size="20" fill="#172554">warp 3</text><rect x="165" y="516" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="172" y="546" font-size="13" fill="#172554">等初始化</text><rect x="292" y="516" width="120" height="48" rx="5" fill="#dbeafe" stroke="#cbd5e1"/><text x="299" y="546" font-size="13" fill="#172554">合作搬运</text><rect x="419" y="516" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="426" y="546" font-size="13" fill="#172554">fence + sync</text><rect x="546" y="516" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="553" y="546" font-size="13" fill="#172554">等待</text><rect x="673" y="516" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="680" y="546" font-size="13" fill="#172554">wait mma</text><rect x="800" y="516" width="120" height="48" rx="5" fill="#dbeafe" stroke="#cbd5e1"/><text x="807" y="546" font-size="13" fill="#172554">TMEM → D</text><rect x="927" y="516" width="120" height="48" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/><text x="934" y="546" font-size="13" fill="#172554">sync</text><text x="30" y="614" font-size="16" fill="#172554">每个 warp 有 32 个线程。时间框只表达依赖顺序，宽度不是测量时间；发射指令不等于计算立即完成。</text></g></svg>