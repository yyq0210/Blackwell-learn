<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img"><title>v08_two_cta完整计算流程</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="28.0" fill="#172554">v08_two_cta：从输入到输出的完整过程</text><text x="30" y="79" font-size="18.0" fill="#172554">例子 M×N×K=512×512×448；两CTA输入，共同256×256结果</text><rect x="35" y="115" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="144" font-size="21.0" fill="#172554">1. 显式cluster</text><text x="48" y="174" font-size="17.0" fill="#172554">2CTA，每CTA256线程</text><text x="48" y="203" font-size="17.0" fill="#172554">peer=blockIdx.x%2；输出合作块256×256</text><path d="M600,224 L600,261" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="265" width="1130" height="106" fill="#eff6ff" stroke="#94a3b8" rx="7"/><text x="48" y="294" font-size="21.0" fill="#172554">2. 分输入</text><text x="48" y="324" font-size="17.0" fill="#172554">每侧A128×64、B128×64</text><text x="48" y="353" font-size="17.0" fill="#172554">两侧producer；leader登记完整65536bytes</text><path d="M600,374 L600,411" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="415" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="444" font-size="21.0" fill="#172554">3. 共同计算</text><text x="48" y="474" font-size="17.0" fill="#172554">只有leader warp4发2CTA MMA</text><text x="48" y="503" font-size="17.0" fill="#172554">A每侧128行；两侧B一起覆盖全部256列</text><path d="M600,524 L600,561" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="565" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="594" font-size="21.0" fill="#172554">4. 广播完成</text><text x="48" y="624" font-size="17.0" fill="#172554">empty/acc_full通知mask=3两侧</text><text x="48" y="653" font-size="17.0" fill="#172554">本地TMEM各128×256；输入环S=6</text><path d="M600,674 L600,711" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="715" width="1130" height="106" fill="#fff7ed" stroke="#94a3b8" rx="7"/><text x="48" y="744" font-size="21.0" fill="#172554">5. 分侧写回</text><text x="48" y="774" font-size="17.0" fill="#172554">每侧4个ei；两侧256线程通知acc_empty</text><text x="48" y="803" font-size="17.0" fill="#172554">退出cluster_sync后两侧协作释放TMEM</text><text x="30" y="906" font-size="17.0" fill="#172554">箭头表示依赖和代码逻辑，不是GPU时钟比例；异步提交后必须等待相应完成事件。</text></g></svg>