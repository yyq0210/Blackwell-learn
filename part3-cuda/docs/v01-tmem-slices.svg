<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img"><title>warp 协作的 TMEM source 与各 lane 的寄存器 destination</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs><rect width="1120" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="25" y="38" font-size="26" fill="#172554">cp.get_slice(37)：warp1 的协作窗口，lane5 的结果</text><text x="25" y="76" font-size="17" fill="#172554">以固定输出列 n 为例：一次 32dp32b1x 操作，由 warp1 的 32 个线程协作执行。</text><rect x="35" y="120" width="290" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="47" y="148" font-size="17" fill="#172554">TMEM[32, n]</text><path d="M340,141 L495,141" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="510" y="120" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="522" y="148" font-size="17" fill="#172554">lane 0</text><path d="M735,141 L865,141" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="875" y="120" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="887" y="148" font-size="17" fill="#172554">thread32：rf[n]</text><rect x="35" y="173" width="290" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="47" y="201" font-size="17" fill="#172554">TMEM[33, n]</text><path d="M340,194 L495,194" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="510" y="173" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="522" y="201" font-size="17" fill="#172554">lane 1</text><path d="M735,194 L865,194" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="875" y="173" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="887" y="201" font-size="17" fill="#172554">thread33：rf[n]</text><rect x="35" y="226" width="290" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="47" y="254" font-size="17" fill="#172554">TMEM[34, n]</text><path d="M340,247 L495,247" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="510" y="226" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="522" y="254" font-size="17" fill="#172554">lane 2</text><path d="M735,247 L865,247" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="875" y="226" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="887" y="254" font-size="17" fill="#172554">thread34：rf[n]</text><rect x="35" y="279" width="290" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="47" y="307" font-size="17" fill="#172554">TMEM[35, n]</text><path d="M340,300 L495,300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="510" y="279" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="522" y="307" font-size="17" fill="#172554">lane 3</text><path d="M735,300 L865,300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="875" y="279" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="887" y="307" font-size="17" fill="#172554">thread35：rf[n]</text><rect x="35" y="332" width="290" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="47" y="360" font-size="17" fill="#172554">TMEM[36, n]</text><path d="M340,353 L495,353" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="510" y="332" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="522" y="360" font-size="17" fill="#172554">lane 4</text><path d="M735,353 L865,353" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="875" y="332" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="887" y="360" font-size="17" fill="#172554">thread36：rf[n]</text><rect x="35" y="385" width="290" height="42" rx="8" fill="#fde68a" stroke="#94a3b8"/><text x="47" y="413" font-size="17" fill="#172554">TMEM[37, n]</text><path d="M340,406 L495,406" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="510" y="385" width="210" height="42" rx="8" fill="#fde68a" stroke="#94a3b8"/><text x="522" y="413" font-size="17" fill="#172554">lane 5</text><path d="M735,406 L865,406" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="875" y="385" width="210" height="42" rx="8" fill="#fde68a" stroke="#94a3b8"/><text x="887" y="413" font-size="17" fill="#172554">thread37：rf[n]</text><rect x="35" y="438" width="290" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="47" y="466" font-size="17" fill="#172554">TMEM[38, n]</text><path d="M340,459 L495,459" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="510" y="438" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="522" y="466" font-size="17" fill="#172554">lane 6</text><path d="M735,459 L865,459" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="875" y="438" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="887" y="466" font-size="17" fill="#172554">thread38：rf[n]</text><rect x="35" y="491" width="290" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="47" y="519" font-size="17" fill="#172554">TMEM[63, n]</text><path d="M340,512 L495,512" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="510" y="491" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="522" y="519" font-size="17" fill="#172554">lane 31</text><path d="M735,512 L865,512" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="875" y="491" width="210" height="42" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="887" y="519" font-size="17" fill="#172554">thread63：rf[n]</text><text x="45" y="570" font-size="16" fill="#172554">图中省略行 39–62。warp1 的源窗口是行 32–63；每个线程最终只接收自己的一行。</text><rect x="35" y="605" width="1050" height="110" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="47" y="633" font-size="17" fill="#172554">partition_S：按协作指令表示源窗口，warp 内不同线程的源视图可以重合</text><text x="47" y="658" font-size="14" fill="#172554">partition_D：thread37 的目标是 D[37,0:128]，不与其他线程重合</text><text x="47" y="683" font-size="14" fill="#172554">重复覆盖 n=0..127，再 FP32→FP16，最后由各线程写回 GMEM</text><text x="35" y="755" font-size="16" fill="#172554">不能把 partition_S 的逻辑元素数直接当成该线程接收的寄存器数；须结合 copy atom 的 Src/Dst 映射。</text></g></svg>