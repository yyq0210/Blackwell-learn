<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 725" role="img"><title>输入合作搬运与输出写回的线程归属对比</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs><rect width="1120" height="100%" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="25" y="38" font-size="26" fill="#172554">同一批 128 个线程，两套不同的数据归属</text><text x="25" y="78" font-size="17" fill="#172554">颜色表示 warp：</text><rect x="205" y="53" width="185" height="42" rx="8" fill="#2563eb" stroke="#94a3b8"/><text x="217" y="81" font-size="17" fill="white">warp0 · t=0–31</text><rect x="415" y="53" width="185" height="42" rx="8" fill="#0d9488" stroke="#94a3b8"/><text x="427" y="81" font-size="17" fill="white">warp1 · t=32–63</text><rect x="625" y="53" width="185" height="42" rx="8" fill="#d97706" stroke="#94a3b8"/><text x="637" y="81" font-size="17" fill="white">warp2 · t=64–95</text><rect x="835" y="53" width="185" height="42" rx="8" fill="#9333ea" stroke="#94a3b8"/><text x="847" y="81" font-size="16.6" fill="white">warp3 · t=96–127</text><text x="35" y="137" font-size="20" fill="#172554">输入 A/B：偶数行 / 奇数行 × K 的前半 / 后半</text><text x="35" y="183" font-size="15" fill="#172554">行 0</text><rect x="110" y="157" width="205" height="33" fill="#2563eb"/><text x="122" y="180" font-size="15" fill="white">warp0：K=0–31</text><rect x="322" y="157" width="205" height="33" fill="#0d9488"/><text x="334" y="180" font-size="15" fill="white">warp1：K=32–63</text><text x="35" y="220" font-size="15" fill="#172554">行 1</text><rect x="110" y="194" width="205" height="33" fill="#d97706"/><text x="122" y="217" font-size="15" fill="white">warp2：K=0–31</text><rect x="322" y="194" width="205" height="33" fill="#9333ea"/><text x="334" y="217" font-size="15" fill="white">warp3：K=32–63</text><text x="35" y="257" font-size="15" fill="#172554">行 2</text><rect x="110" y="231" width="205" height="33" fill="#2563eb"/><text x="122" y="254" font-size="15" fill="white">warp0：K=0–31</text><rect x="322" y="231" width="205" height="33" fill="#0d9488"/><text x="334" y="254" font-size="15" fill="white">warp1：K=32–63</text><text x="35" y="294" font-size="15" fill="#172554">行 3</text><rect x="110" y="268" width="205" height="33" fill="#d97706"/><text x="122" y="291" font-size="15" fill="white">warp2：K=0–31</text><rect x="322" y="268" width="205" height="33" fill="#9333ea"/><text x="334" y="291" font-size="15" fill="white">warp3：K=32–63</text><text x="35" y="331" font-size="15" fill="#172554">行 4</text><rect x="110" y="305" width="205" height="33" fill="#2563eb"/><text x="122" y="328" font-size="15" fill="white">warp0：K=0–31</text><rect x="322" y="305" width="205" height="33" fill="#0d9488"/><text x="334" y="328" font-size="15" fill="white">warp1：K=32–63</text><text x="35" y="368" font-size="15" fill="#172554">行 5</text><rect x="110" y="342" width="205" height="33" fill="#d97706"/><text x="122" y="365" font-size="15" fill="white">warp2：K=0–31</text><rect x="322" y="342" width="205" height="33" fill="#9333ea"/><text x="334" y="365" font-size="15" fill="white">warp3：K=32–63</text><text x="35" y="405" font-size="15" fill="#172554">行 6</text><rect x="110" y="379" width="205" height="33" fill="#2563eb"/><text x="122" y="402" font-size="15" fill="white">warp0：K=0–31</text><rect x="322" y="379" width="205" height="33" fill="#0d9488"/><text x="334" y="402" font-size="15" fill="white">warp1：K=32–63</text><text x="35" y="442" font-size="15" fill="#172554">行 7</text><rect x="110" y="416" width="205" height="33" fill="#d97706"/><text x="122" y="439" font-size="15" fill="white">warp2：K=0–31</text><rect x="322" y="416" width="205" height="33" fill="#9333ea"/><text x="334" y="439" font-size="15" fill="white">warp3：K=32–63</text><text x="110" y="487" font-size="16" fill="#172554">… 按奇偶行重复到第 127 行</text><text x="600" y="137" font-size="20" fill="#172554">输出 D：每个 warp 负责连续 32 行</text><rect x="600" y="157" width="475" height="70" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="612" y="185" font-size="17" fill="#172554">warp0：输出行 0–31</text><text x="612" y="210" font-size="14" fill="#172554">每个线程固定一行，覆盖全部 128 列</text><rect x="600" y="235" width="475" height="70" rx="8" fill="#ccfbf1" stroke="#94a3b8"/><text x="612" y="263" font-size="17" fill="#172554">warp1：输出行 32–63</text><text x="612" y="288" font-size="14" fill="#172554">每个线程固定一行，覆盖全部 128 列</text><rect x="600" y="313" width="475" height="70" rx="8" fill="#fef3c7" stroke="#94a3b8"/><text x="612" y="341" font-size="17" fill="#172554">warp2：输出行 64–95</text><text x="612" y="366" font-size="14" fill="#172554">每个线程固定一行，覆盖全部 128 列</text><rect x="600" y="391" width="475" height="70" rx="8" fill="#ede9fe" stroke="#94a3b8"/><text x="612" y="419" font-size="17" fill="#172554">warp3：输出行 96–127</text><text x="612" y="444" font-size="14" fill="#172554">每个线程固定一行，覆盖全部 128 列</text><rect x="35" y="535" width="1040" height="110" rx="8" fill="#fff7ed" stroke="#94a3b8"/><text x="47" y="563" font-size="17" fill="#172554">thread82 = warp2 / lane18</text><text x="47" y="588" font-size="14" fill="#172554">输入：A/B 的所有奇数行、K=18，共各 64 个 FP16</text><text x="47" y="613" font-size="14" fill="#172554">输出：D[82,0:128]，共 128 个结果</text><text x="35" y="689" font-size="16" fill="#172554">输入 owner = 64×(row mod 2)+k；输出 owner = m。此关系已用当前 CUTLASS 实际执行/布局检查。</text></g></svg>