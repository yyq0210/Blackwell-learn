<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" role="img" aria-labelledby="title desc"><title id="title">ldmatrix.x1 地址提供与数据归属</title><desc id="desc">每个8乘8矩阵以相同方式分发给全部32个lanes；不同矩阵进入各lane的不同目的寄存器。黄色标出接收者lane5的数据。</desc><g font-family="sans-serif"><rect x="0" y="0" width="1100" height="750" rx="3" fill="#ffffff" stroke="none" stroke-width="1"/><text x="25" y="35" font-size="24" fill="#18324c" font-weight="bold">ldmatrix.sync.aligned.m8n8.x1.shared.b16</text><text x="25" y="68" font-size="18" fill="#18324c" font-weight="normal">加载 1 个 8×8 矩阵；全部 32 lanes 执行；每 lane 得到 1 个 32-bit 寄存器。</text><text x="25" y="98" font-size="17" fill="#18324c" font-weight="normal">蓝色“地址lane”负责报告一行从哪开始；格内 L编号 是接收这个元素的 lane。</text><text x="25" y="126" font-size="17" fill="#18324c" font-weight="normal">非 .trans；每对相邻 16-bit 元素装进一个 32-bit 寄存器。黄色示例：接收者 lane 5。</text><text x="25" y="175" font-size="20" fill="#18324c" font-weight="bold">M0 → 每个 lane 的 d0</text><text x="25" y="198" font-size="15" fill="#2363a0" font-weight="normal">地址由 lanes 0～7 提供</text><text x="166" y="222" font-size="13" fill="#18324c" font-weight="normal">c0</text><text x="209" y="222" font-size="13" fill="#18324c" font-weight="normal">c1</text><text x="252" y="222" font-size="13" fill="#18324c" font-weight="normal">c2</text><text x="295" y="222" font-size="13" fill="#18324c" font-weight="normal">c3</text><text x="338" y="222" font-size="13" fill="#18324c" font-weight="normal">c4</text><text x="381" y="222" font-size="13" fill="#18324c" font-weight="normal">c5</text><text x="424" y="222" font-size="13" fill="#18324c" font-weight="normal">c6</text><text x="467" y="222" font-size="13" fill="#18324c" font-weight="normal">c7</text><text x="25" y="249" font-size="14" fill="#2363a0" font-weight="normal">地址 L0 → r0</text><rect x="160" y="230" width="41" height="27" rx="3" fill="#dbeafe" stroke="#b7c8d9" stroke-width="1"/><text x="166" y="248" font-size="13" fill="#18324c" font-weight="normal">L0</text><rect x="203" y="230" width="41" height="27" rx="3" fill="#dbeafe" stroke="#b7c8d9" stroke-width="1"/><text x="209" y="248" font-size="13" fill="#18324c" font-weight="normal">L0</text><rect x="246" y="230" width="41" height="27" rx="3" fill="#dbeafe" stroke="#b7c8d9" stroke-width="1"/><text x="252" y="248" font-size="13" fill="#18324c" font-weight="normal">L1</text><rect x="289" y="230" width="41" height="27" rx="3" fill="#dbeafe" stroke="#b7c8d9" stroke-width="1"/><text x="295" y="248" font-size="13" fill="#18324c" font-weight="normal">L1</text><rect x="332" y="230" width="41" height="27" rx="3" fill="#dbeafe" stroke="#b7c8d9" stroke-width="1"/><text x="338" y="248" font-size="13" fill="#18324c" font-weight="normal">L2</text><rect x="375" y="230" width="41" height="27" rx="3" fill="#dbeafe" stroke="#b7c8d9" stroke-width="1"/><text x="381" y="248" font-size="13" fill="#18324c" font-weight="normal">L2</text><rect x="418" y="230" width="41" height="27" rx="3" fill="#dbeafe" stroke="#b7c8d9" stroke-width="1"/><text x="424" y="248" font-size="13" fill="#18324c" font-weight="normal">L3</text><rect x="461" y="230" width="41" height="27" rx="3" fill="#dbeafe" stroke="#b7c8d9" stroke-width="1"/><text x="467" y="248" font-size="13" fill="#18324c" font-weight="normal">L3</text><text x="25" y="278" font-size="14" fill="#2363a0" font-weight="normal">地址 L1 → r1</text><rect x="160" y="259" width="41" height="27" rx="3" fill="#dcfce7" stroke="#b7c8d9" stroke-width="1"/><text x="166" y="277" font-size="13" fill="#18324c" font-weight="normal">L4</text><rect x="203" y="259" width="41" height="27" rx="3" fill="#dcfce7" stroke="#b7c8d9" stroke-width="1"/><text x="209" y="277" font-size="13" fill="#18324c" font-weight="normal">L4</text><rect x="246" y="259" width="41" height="27" rx="3" fill="#ffc857" stroke="#915300" stroke-width="2"/><text x="252" y="277" font-size="13" fill="#18324c" font-weight="normal">L5</text><rect x="289" y="259" width="41" height="27" rx="3" fill="#ffc857" stroke="#915300" stroke-width="2"/><text x="295" y="277" font-size="13" fill="#18324c" font-weight="normal">L5</text><rect x="332" y="259" width="41" height="27" rx="3" fill="#dcfce7" stroke="#b7c8d9" stroke-width="1"/><text x="338" y="277" font-size="13" fill="#18324c" font-weight="normal">L6</text><rect x="375" y="259" width="41" height="27" rx="3" fill="#dcfce7" stroke="#b7c8d9" stroke-width="1"/><text x="381" y="277" font-size="13" fill="#18324c" font-weight="normal">L6</text><rect x="418" y="259" width="41" height="27" rx="3" fill="#dcfce7" stroke="#b7c8d9" stroke-width="1"/><text x="424" y="277" font-size="13" fill="#18324c" font-weight="normal">L7</text><rect x="461" y="259" width="41" height="27" rx="3" fill="#dcfce7" stroke="#b7c8d9" stroke-width="1"/><text x="467" y="277" font-size="13" fill="#18324c" font-weight="normal">L7</text><text x="25" y="307" font-size="14" fill="#2363a0" font-weight="normal">地址 L2 → r2</text><rect x="160" y="288" width="41" height="27" rx="3" fill="#fef3c7" stroke="#b7c8d9" stroke-width="1"/><text x="166" y="306" font-size="13" fill="#18324c" font-weight="normal">L8</text><rect x="203" y="288" width="41" height="27" rx="3" fill="#fef3c7" stroke="#b7c8d9" stroke-width="1"/><text x="209" y="306" font-size="13" fill="#18324c" font-weight="normal">L8</text><rect x="246" y="288" width="41" height="27" rx="3" fill="#fef3c7" stroke="#b7c8d9" stroke-width="1"/><text x="252" y="306" font-size="13" fill="#18324c" font-weight="normal">L9</text><rect x="289" y="288" width="41" height="27" rx="3" fill="#fef3c7" stroke="#b7c8d9" stroke-width="1"/><text x="295" y="306" font-size="13" fill="#18324c" font-weight="normal">L9</text><rect x="332" y="288" width="41" height="27" rx="3" fill="#fef3c7" stroke="#b7c8d9" stroke-width="1"/><text x="338" y="306" font-size="13" fill="#18324c" font-weight="normal">L10</text><rect x="375" y="288" width="41" height="27" rx="3" fill="#fef3c7" stroke="#b7c8d9" stroke-width="1"/><text x="381" y="306" font-size="13" fill="#18324c" font-w