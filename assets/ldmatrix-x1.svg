ize="13" fill="#18324c" font-weight="normal">L31</text><rect x="461" y="433" width="41" height="27" rx="3" fill="#f3e8ff" stroke="#b7c8d9" stroke-width="1"/><text x="467" y="451" font-size="13" fill="#18324c" font-weight="normal">L31</text><text x="25" y="484" font-size="14" fill="#18324c" font-weight="normal">64 个元素 = 32 lanes × 2 元素；这一整张矩阵进入 d0。</text><rect x="25" y="515" width="1050" height="192" rx="3" fill="#eef5fc" stroke="#b7c8d9" stroke-width="1"/><text x="42" y="543" font-size="18" fill="#18324c" font-weight="bold">只看 lane 5：它在每个矩阵里都接收 row=1、columns=2和3。</text><text x="42" y="572" font-size="17" fill="#18324c" font-weight="normal">lane 5 的 d0 = pack16( M0[1,2], M0[1,3] )</text><text x="42" y="692" font-size="15" fill="#18324c" font-weight="normal">.x1 不是“只有 8 个 lane 接收”，也不是复制 M0；输入块由各组行地址决定。</text></g></svg>