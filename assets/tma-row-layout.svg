<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 825" role="img"><title>128B swizzle：相同1024B重复区，不同逻辑行分组</title><g font-family="sans-serif"><rect width="1160" height="825" fill="white"/><text x="25" y="35" font-size="23" fill="#213a55">固定规则：每个128B span内重排8个16B sectors；8个span后模式重复。</text><text x="25" y="80" font-size="19" fill="#213a55">128B groups：同group的行依次排列</text><text x="25" y="110" font-size="17" fill="#213a55">一个1024B重复区中的8个span：</text><rect x="25" y="130" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="35" y="153" font-size="16" fill="#213a55">span0：逻辑row0 / g0，XOR index=0</text><rect x="25" y="169" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="35" y="192" font-size="16" fill="#213a55">span1：逻辑row1 / g0，XOR index=1</text><rect x="25" y="208" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="35" y="231" font-size="16" fill="#213a55">span2：逻辑row2 / g0，XOR index=2</text><rect x="25" y="247" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="35" y="270" font-size="16" fill="#213a55">span3：逻辑row3 / g0，XOR index=3</text><rect x="25" y="286" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="35" y="309" font-size="16" fill="#213a55">span4：逻辑row4 / g0，XOR index=4</text><rect x="25" y="325" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="35" y="348" font-size="16" fill="#213a55">span5：逻辑row5 / g0，XOR index=5</text><rect x="25" y="364" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="35" y="387" font-size="16" fill="#213a55">span6：逻辑row6 / g0，XOR index=6</text><rect x="25" y="403" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="35" y="426" font-size="16" fill="#213a55">span7：逻辑row7 / g0，XOR index=7</text><text x="25" y="475" font-size="17" fill="#213a55">投影到逻辑网格：8行×8 sectors=1024B</text><text x="25" y="525" font-size="18" fill="#213a55">同样读取：rows0..7，每行逻辑sector0</text><rect x="25" y="550" width="124" height="46" fill="#dbeafe" stroke="#849bb2"/><text x="33" y="579" font-size="17" fill="#213a55">r0 → S0</text><rect x="157" y="550" width="124" height="46" fill="#fce7c8" stroke="#849bb2"/><text x="165" y="579" font-size="17" fill="#213a55">r1 → S1</text><rect x="289" y="550" width="124" height="46" fill="#fbd6d8" stroke="#849bb2"/><text x="297" y="579" font-size="17" fill="#213a55">r2 → S2</text><rect x="421" y="550" width="124" height="46" fill="#ccece3" stroke="#849bb2"/><text x="429" y="579" font-size="17" fill="#213a55">r3 → S3</text><rect x="25" y="608" width="124" height="46" fill="#daf0cf" stroke="#849bb2"/><text x="33" y="637" font-size="17" fill="#213a55">r4 → S4</text><rect x="157" y="608" width="124" height="46" fill="#f8eeb4" stroke="#849bb2"/><text x="165" y="637" font-size="17" fill="#213a55">r5 → S5</text><rect x="289" y="608" width="124" height="46" fill="#e4d9f5" stroke="#849bb2"/><text x="297" y="637" font-size="17" fill="#213a55">r6 → S6</text><rect x="421" y="608" width="124" height="46" fill="#f6d8e7" stroke="#849bb2"/><text x="429" y="637" font-size="17" fill="#213a55">r7 → S7</text><text x="25" y="700" font-size="18" fill="#213a55">8个bank groups各一次：无额外冲突</text><text x="595" y="80" font-size="19" fill="#213a55">256B stride：每逻辑行的两个span紧挨着</text><text x="595" y="110" font-size="17" fill="#213a55">一个1024B重复区中的8个span：</text><rect x="595" y="130" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="605" y="153" font-size="16" fill="#213a55">span0：逻辑row0 / g0，XOR index=0</text><rect x="595" y="169" width="530" height="34" fill="#ffe8c8" stroke="#8ba4bd"/><text x="605" y="192" font-size="16" fill="#213a55">span1：逻辑row0 / g1，XOR index=1</text><rect x="595" y="208" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="605" y="231" font-size="16" fill="#213a55">span2：逻辑row1 / g0，XOR index=2</text><rect x="595" y="247" width="530" height="34" fill="#ffe8c8" stroke="#8ba4bd"/><text x="605" y="270" font-size="16" fill="#213a55">span3：逻辑row1 / g1，XOR index=3</text><rect x="595" y="286" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="605" y="309" font-size="16" fill="#213a55">span4：逻辑row2 / g0，XOR index=4</text><rect x="595" y="325" width="530" height="34" fill="#ffe8c8" stroke="#8ba4bd"/><text x="605" y="348" font-size="16" fill="#213a55">span5：逻辑row2 / g1，XOR index=5</text><rect x="595" y="364" width="530" height="34" fill="#dceeff" stroke="#8ba4bd"/><text x="605" y="387" font-size="16" fill="#213a55">span6：逻辑row3 / g0，XOR index=6</text><rect x="595" y="403" width="530" height="34" fill="#ffe8c8" stroke="#8ba4bd"/><text x="605" y="426" font-size="16" fill="#213a55">span7：逻辑row3 / g1，XOR index=7</text><text x="595" y="475" font-size="17" fill="#213a55">投影到逻辑网格：4行×16 sectors=1024B</text><text x="595" y="525" font-size="18" fill="#213a55">同样读取：rows0..7，每行逻辑sector0</text><rect x="595" y="550" width="124" height="46" fill="#dbeafe" stroke="#849bb2"/><text x="603" y="579" font-size="17" fill="#213a55">r0 → S0</text><rect x="727" y="550" width="124" height="46" fill="#fbd6d8" stroke="#849bb2"/><text x="735" y="579" font-size="17" fill="#213a55">r1 → S2</text><rect x="859" y="550" width="124" height="46" fill="#daf0cf" stroke="#849bb2"/><text x="867" y="579" font-size="17" fill="#213a55">r2 → S4</text><rect x="991" y="550" width="124" height="46" fill="#e4d9f5" stroke="#849bb2"/><text x="999" y="579" font-size="17" fill="#213a55">r3 → S6</text><rect x="595" y="608" width="124" height="46" fill="#dbeafe" stroke="#849bb2"/><text x="603" y="637" font-size="17" fill="#213a55">r4 → S0</text><rect x="727" y="608" width="124" height="46" fill="#fbd6d8" stroke="#849bb2"/><text x="735" y="637" font-size="17" fill="#213a55">r5 → S2</text><rect x="859" y="608" width="124" height="46" fill="#daf0cf" stroke="#849bb2"/><text x="867" y="637" font-size="17" fill="#213a55">r6 → S4</text><rect x="991" y="608" width="124" height="46" fill="#e4d9f5" stroke="#849bb2"/><text x="999" y="637" font-size="17" fill="#213a55">r7 → S6</text><text x="595" y="700" font-size="18" fill="#213a55">只有4个bank groups，各两次：2-way conflict</text><text x="25" y="758" font-size="18" fill="#213a55">每个S表示四个banks。1024B是重排模式重复区；所选8×16B读取只有128B。</text><text x="25" y="791" font-size="18" fill="#213a55">形状面积相同并不能保证无冲突；需要检查同一服务批次里访问的bank是否重复。</text></g></svg>